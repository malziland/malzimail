# Continuous Integration: runs on every push and pull request.
# Becomes active as soon as this repository is pushed to GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the checkout. gitleaks needs the token to
# read PR metadata (see below) but no write scope. Pinning this in the workflow
# means it no longer depends on the repository's default-permissions setting.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The runner image ships no init.defaultBranch, so the `git init` that
      # actions/checkout runs prints a multi-line hint about 'master' vs 'main'.
      # Harmless and unrelated to this repository, but it is log noise on every
      # run — set the value once so checkout stays quiet. Must come BEFORE the
      # checkout step to have any effect.
      - name: Keep git's default-branch hint out of the log
        run: git config --global init.defaultBranch main

      # Third-party and first-party actions pinned to immutable commit SHAs
      # (mutable major tags can be re-pointed). Dependabot keeps the SHAs current
      # and the trailing comment records the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # npm install (nicht npm ci): einige Dev-Abhängigkeiten bringen plattform-
        # spezifische optionale Native-Bindings mit (z. B. @emnapi/*), die eine auf
        # macOS erzeugte Lockfile für Linux nicht festhält — das strikte npm ci würde
        # daran scheitern. npm install löst die Plattform-Deps auf dem Runner selbst auf.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Real gate (vitest.config.js): lines/statements/functions >= 90, branches >= 80.
      - name: Tests + Coverage (Gate 90/90/90/80)
        run: npm run test:coverage

      # Structural accessibility rules (axe-core in jsdom); the color-contrast
      # rule needs real rendering and is covered by the design tokens instead.
      - name: Accessibility checks (axe-core)
        run: npm run test:a11y

      # Scan the dependencies that actually ship in the Worker. Build/test tools
      # (esbuild, wrangler, vitest) are kept current via Dependabot instead, so
      # a dev-tool advisory does not block the pipeline.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  # Secret scanning: fail the build if any credential pattern is committed
  # (full history checkout so historical leaks are caught too).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Keep git's default-branch hint out of the log
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          # Required since gitleaks-action v3 for scanning pull requests (reads PR
          # metadata). The automatic token is read-only here (permissions above);
          # without it the job fails on every PR — which blocked all Dependabot PRs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v3 (already the latest release) pulls in a dependency
          # that still uses Node's deprecated `punycode` module, so every run logs
          # a DeprecationWarning we cannot fix upstream and cannot act on. This job
          # runs no first-party code, so suppressing deprecations here hides nothing
          # of ours. Drop this line once the action stops emitting it.
          NODE_OPTIONS: --no-deprecation

  # Merge routine Dependabot updates without human involvement.
  #
  # `needs` is the entire safety gate: this job cannot start unless BOTH check
  # and secret-scan went green, so the merge below is unconditional by design and
  # needs neither `gh pr merge --auto` nor a branch protection rule. Keeping main
  # unprotected is deliberate — the maintainer pushes to it directly.
  #
  # Workflow runs triggered by Dependabot get a read-only token by default; since
  # 2021-10-11 the `permissions` key can raise it, which is what happens here.
  # Scope is job-level so `check` and `secret-scan` — the jobs that execute
  # untrusted PR content via npm install — keep the read-only token from above.
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    needs: [check, secret-scan]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Held back on purpose: a major bump of a dependency that ships inside the
      # Worker (postal-mime, qrcode-svg) can change runtime behaviour in ways the
      # test suite does not necessarily cover. Everything else — all dev tooling,
      # all GitHub Actions, and patch/minor production bumps — merges itself.
      # Note: merging only moves main forward; malzimail.at is deployed by hand.
      - name: Squash-merge the update
        if: ${{ !(steps.meta.outputs.dependency-type == 'direct:production' && steps.meta.outputs.update-type == 'version-update:semver-major') }}
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain why this one was left open
        if: ${{ steps.meta.outputs.dependency-type == 'direct:production' && steps.meta.outputs.update-type == 'version-update:semver-major' }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Auto-merge skipped: major version bump of a production dependency. Needs a human look before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
