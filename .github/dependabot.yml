# Dependabot: keep dependencies and CI actions patched; flag known vulnerabilities.
#
# Noise policy: updates are BATCHED into a few grouped pull requests on a monthly
# cadence instead of one PR per package. Combined with the auto-merge job in
# ci.yml, a routine update cycle needs no human attention at all — mail only
# arrives when CI actually fails, or when a production dependency wants a major
# version (that case is deliberately left for a human to look at).
#
# Groups are split by dependency-type on purpose: the auto-merge job reads
# `dependency-type` from the PR metadata, and that output is only unambiguous
# when a single PR does not mix production and development dependencies.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    # Keep the batched PRs on the repo's Conventional-Commits style, so the
    # squashed merge commit reads like every other maintenance commit.
    commit-message:
      # `include: scope` appends (deps) / (deps-dev) itself — a prefix of
      # "chore(deps)" would produce "chore(deps)(deps-dev):".
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    ignore:
      # jsdom 30 requires Node ^22.22.2 || ^24.15.0 || >=26.0.0. The maintainer's
      # machine runs an older 24.x, so auto-merging that major would make every
      # local `npm install` print an EBADENGINE warning while buying nothing —
      # jsdom only backs the axe-core a11y tests. Drop this entry once the local
      # Node is >= 24.15 (check with `node -v`); patch/minor updates still flow.
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
    groups:
      # Ships inside the Worker — a major bump here is NOT auto-merged.
      production-dependencies:
        dependency-type: production
      # Build/test tooling only (vitest, eslint, wrangler, …). Never reaches the
      # deployed Worker, so a green CI run is a sufficient gate.
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Keep the batched PRs on the repo's Conventional-Commits style, so the
    # squashed merge commit reads like every other maintenance commit.
    commit-message:
      # `include: scope` appends (deps) / (deps-dev) itself — a prefix of
      # "chore(deps)" would produce "chore(deps)(deps-dev):".
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
